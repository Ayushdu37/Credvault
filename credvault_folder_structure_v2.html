<style>
*{box-sizing:border-box;margin:0;padding:0}
.tw{font-size:13px;line-height:1.55;padding:4px 0}
.row{display:flex;align-items:center;gap:5px;padding:2px 6px;border-radius:4px;min-height:22px;cursor:default}
.row:hover{background:var(--color-background-secondary)}
.fr{cursor:pointer}
.arr{font-size:9px;width:10px;flex-shrink:0;color:var(--color-text-tertiary);transition:transform .12s;display:inline-block}
.arr.o{transform:rotate(90deg)}
.ch{padding-left:14px;border-left:1px solid var(--color-border-tertiary);margin-left:8px}
.ch.cl{display:none}
.fn{font-family:var(--font-mono);font-size:12px;color:var(--color-text-primary)}
.fw{font-weight:500}
.nt{font-size:11px;color:var(--color-text-tertiary);font-family:var(--font-sans);margin-left:2px}
.sp{width:10px;flex-shrink:0}
.c-cs{color:#185FA5}.c-ts{color:#0F6E56}.c-json{color:#854F0B}.c-yaml,.c-yml{color:#534AB7}.c-sql{color:#993C1D}.c-scss{color:#993556}.c-md,.c-def,.c-env,.c-sln,.c-csproj,.c-docker{color:var(--color-text-secondary)}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.d-cs{background:#378ADD}.d-ts{background:#1D9E75}.d-json{background:#EF9F27}.d-yaml,.d-yml{background:#7F77DD}.d-sql{background:#D85A30}.d-scss{background:#ED93B1}.d-docker,.d-csproj,.d-sln{background:#85B7EB}.d-md,.d-env,.d-def{background:#B4B2A9}
.b{font-size:10px;padding:1px 5px;border-radius:3px;font-family:var(--font-sans);flex-shrink:0}
.bd{background:#EEEDFE;color:#534AB7}.ba{background:#E1F5EE;color:#0F6E56}.bi{background:#FAECE7;color:#993C1D}.bp{background:#E6F1FB;color:#185FA5}.bs{background:#FAEEDA;color:#854F0B}.bn{background:#E1F5EE;color:#085041}.bc{background:#EEEDFE;color:#3C3489}.bw{background:#F1EFE8;color:#444441}
.tb{display:flex;gap:6px;align-items:center;padding:8px;border-bottom:0.5px solid var(--color-border-tertiary);margin-bottom:4px;flex-wrap:wrap}
.tb .tit{font-size:13px;font-weight:500;font-family:var(--font-mono);color:var(--color-text-primary)}
.lg{display:flex;flex-wrap:wrap;gap:6px;padding:8px 6px 4px;border-top:0.5px solid var(--color-border-tertiary);margin-top:4px}
.pill{font-size:10px;padding:1px 7px;border-radius:10px;font-family:var(--font-sans);background:#E1F5EE;color:#085041;border:0.5px solid #5DCAA5}
</style>

<div class="tb">
  <span class="tit">credvault/</span>
  <span style="font-size:11px;color:#0F6E56;font-family:var(--font-sans);padding:1px 7px;border-radius:10px;background:#E1F5EE;border:0.5px solid #5DCAA5">v2 · 5 services</span>
  <button onclick="xAll(1)">Expand all</button>
  <button onclick="xAll(0)">Collapse all</button>
  <button onclick="xSec(2,1)">Services ↗</button>
  <button onclick="xSec(2,2)">Angular SPA ↗</button>
  <button onclick="xSec(1)">Contracts ↗</button>
</div>

<div class="tw" id="tr"></div>

<div class="lg">
  <span class="b bd">Domain</span>
  <span class="b ba">Application</span>
  <span class="b bi">Infrastructure</span>
  <span class="b bp">API / Gateway</span>
  <span class="b bs">Angular feature</span>
  <span class="b bn">Shared NuGet</span>
  <span class="b bc">Contracts</span>
  <span class="b bw">CI/CD</span>
</div>

<script>
let _uid=0;
const BL={bd:'Domain',ba:'Application',bi:'Infrastructure',bp:'API',bs:'Angular',bn:'Shared NuGet',bc:'Contracts',bw:'CI/CD'};
const F=(n,b,nt,...c)=>({t:'f',n,b,nt,c:c.flat(),id:'n'+(_uid++)});
const f=(n,...c)=>({t:'f',n,c:c.flat(),id:'n'+(_uid++)});
const fi=(n,nt)=>({t:'i',n,nt});
function gext(n){
  if(n==='Dockerfile')return 'docker';
  if(n.startsWith('.env')||n==='env')return 'env';
  const e=n.split('.').pop().toLowerCase();
  const known=new Set(['cs','ts','json','yaml','yml','sql','md','scss','csproj','sln','docker']);
  return known.has(e)?e:'def';
}
const svc=(slug,dis,cfg)=>f(slug+'/',
  F(dis+'.Domain/','bd','Entities · Interfaces · Domain Events',
    f('Entities/',...cfg.ent.map(e=>fi(e+'.cs'))),
    f('Events/',...(cfg.devt.length?cfg.devt.map(e=>fi(e+'DomainEvent.cs')):[fi('(none)')])),
    f('Interfaces/',...cfg.ent.map(e=>fi('I'+e+'Repository.cs')))
  ),
  F(dis+'.Application/','ba','Commands · Queries · Validators'+(cfg.saga?' · Saga':''),
    f('Commands/',...cfg.cmds.map(c=>f(c+'/',fi(c+'Command.cs'),fi(c+'CommandHandler.cs')))),
    f('Queries/',...cfg.qry.map(q=>f(q+'/',fi(q+'Query.cs'),fi(q+'QueryHandler.cs')))),
    f('Validators/',...cfg.cmds.map(c=>fi(c+'Validator.cs'))),
    ...(cfg.saga?[f('Sagas/',fi(cfg.saga+'StateMachine.cs'),fi(cfg.saga+'SagaState.cs'))]:[])
  ),
  F(dis+'.Infrastructure/','bi','EF Core · RabbitMQ publishers & consumers',
    f('Persistence/',
      fi(dis+'DbContext.cs'),
      f('Configurations/',...cfg.ent.map(e=>fi(e+'Configuration.cs'))),
      f('Repositories/',...cfg.ent.map(e=>fi(e+'Repository.cs'))),
      f('Migrations/',fi('(auto-generated by dotnet ef migrations)'))
    ),
    f('Messaging/',
      f('Publishers/',...(cfg.pub.length?cfg.pub.map(e=>fi(e+'Publisher.cs')):[fi('(none)')])),
      f('Consumers/',...(cfg.sub.length?cfg.sub.map(e=>fi(e+'Consumer.cs')):[fi('(none)')]))
    )
  ),
  F(dis+'.API/','bp','Controllers · Middleware · DI · Program.cs',
    f('Controllers/',...(cfg.ctrl||cfg.ent).map(c=>fi(c+'Controller.cs'))),
    f('Middleware/',fi('ExceptionMiddleware.cs')),
    fi('appsettings.json'),fi('appsettings.Development.json'),fi('Program.cs'),fi('Dockerfile'),fi(dis+'.API.csproj')
  )
);

const tree=f('credvault/',
  F('.github/','bw','One workflow file per service + Angular SPA',
    f('workflows/',
      fi('identity-service.yml'),
      fi('card-service.yml'),
      fi('billing-service.yml'),
      fi('payment-service.yml'),
      fi('notification-service.yml'),
      fi('angular-spa.yml')
    )
  ),
  F('contracts/','bc','OpenAPI specs per service + Event JSON Schemas',
    f('api/',
      ...['identity','card','billing','payment','notification'].map(s=>
        f(s+'-service/',fi('openapi.v1.yaml'),f('examples/',fi('request.json'),fi('response.json')))
      )
    ),
    f('events/',
      f('identity/',fi('UserRegistered.v1.json'),fi('PasswordResetRequested.v1.json')),
      f('card/',fi('CardAdded.v1.json'),fi('CardExpirySoon.v1.json')),
      f('billing/',fi('BillGenerated.v1.json'),fi('BillDueReminder.v1.json'),fi('RewardEarned.v1.json','merged from rewards-service')),
      f('payment/',fi('PaymentInitiated.v1.json'),fi('PaymentCompleted.v1.json'),fi('PaymentFailed.v1.json'),fi('FraudDetected.v1.json','merged from security-service'))
    )
  ),
  f('src/',
    F('CredVault.Shared.Contracts/','bn','NuGet package — every service references this',
      f('Common/',fi('ApiResponse.cs'),fi('PagedResponse.cs')),
      f('Identity/',
        f('Requests/',fi('RegisterRequest.cs'),fi('LoginRequest.cs'),fi('VerifyOtpRequest.cs')),
        f('Responses/',fi('AuthResponse.cs'),fi('UserProfileResponse.cs')),
        f('Events/',fi('UserRegisteredEvent.cs'),fi('PasswordResetRequestedEvent.cs'))
      ),
      f('Card/',
        f('Requests/',fi('AddCardRequest.cs'),fi('UpdateCardLimitRequest.cs')),
        f('Responses/',fi('CardResponse.cs'),fi('CardSummaryResponse.cs')),
        f('Events/',fi('CardAddedEvent.cs'),fi('CardExpirySoonEvent.cs'))
      ),
      f('Billing/',
        f('Requests/',fi('GenerateBillRequest.cs')),
        f('Responses/',fi('BillResponse.cs'),fi('BillSummaryResponse.cs')),
        f('Events/',fi('BillGeneratedEvent.cs'),fi('BillDueReminderEvent.cs'),fi('RewardEarnedEvent.cs','published by billing after PaymentCompleted'))
      ),
      f('Payment/',
        f('Requests/',fi('InitiatePaymentRequest.cs')),
        f('Responses/',fi('PaymentResponse.cs'),fi('TransactionResponse.cs')),
        f('Events/',fi('PaymentInitiatedEvent.cs'),fi('PaymentCompletedEvent.cs'),fi('PaymentFailedEvent.cs'),fi('FraudDetectedEvent.cs','published by payment on risk failure'))
      ),
      f('Enums/',fi('CardIssuer.cs'),fi('BillStatus.cs'),fi('PaymentStatus.cs'),fi('RewardTier.cs')),
      fi('CredVault.Shared.Contracts.csproj')
    ),
    f('services/',
      f('ocelot-gateway/',
        F('OcelotGateway.API/','bp','Single entry point — routes all traffic to 5 downstream services',
          fi('ocelot.json','Routes: /api/identity · /api/cards · /api/billing · /api/payments · /api/notify'),
          fi('appsettings.json'),fi('Program.cs'),fi('Dockerfile'),fi('OcelotGateway.API.csproj')
        )
      ),
      svc('identity-service','IdentityService',{
        ent:['User','RefreshToken','OTPCode'],
        devt:['UserRegistered','PasswordResetRequested'],
        cmds:['RegisterUser','VerifyEmail','LoginUser','RefreshToken','SendOTP','VerifyOTP','ResetPassword'],
        qry:['GetUserProfile','GetUserById','GetActiveSessions'],
        pub:['UserRegistered','PasswordResetRequested'],
        sub:[],
        ctrl:['Auth','Users']
      }),
      svc('card-service','CardService',{
        ent:['CreditCard','CardIssuer'],
        devt:['CardAdded','CardExpirySoon'],
        cmds:['AddCard','RemoveCard','SetDefaultCard','VerifyCard','UpdateCardLimit'],
        qry:['GetCards','GetCardById','GetCardUtilization'],
        pub:['CardAdded','CardExpirySoon'],
        sub:['PaymentCompleted'],
        ctrl:['Cards']
      }),
      svc('billing-service','BillingService',{
        ent:['Bill','PaymentSchedule'],
        devt:['BillGenerated','BillDueReminder','RewardEarned'],
        cmds:['GenerateBill','UpdateBillStatus','SchedulePayment','CancelSchedule'],
        qry:['GetBills','GetBillById','GetUpcomingBills','GetSpendingSummary'],
        pub:['BillGenerated','BillDueReminder','RewardEarned'],
        sub:['PaymentCompleted'],
        ctrl:['Bills','Schedules']
      }),
      svc('payment-service','PaymentService',{
        ent:['Payment','PaymentSaga','Transaction','RiskScore'],
        devt:['PaymentInitiated','PaymentCompleted','PaymentFailed','FraudDetected'],
        cmds:['InitiatePayment','CompletePayment','ReversePayment','EvaluateRisk'],
        qry:['GetPayments','GetTransactions','GetPaymentById','GetRiskScore'],
        saga:'Payment',
        pub:['PaymentInitiated','PaymentCompleted','PaymentFailed','FraudDetected'],
        sub:[],
        ctrl:['Payments','Transactions']
      }),
      svc('notification-service','NotificationService',{
        ent:['NotificationLog','EmailTemplate','AuditLog'],
        devt:[],
        cmds:['SendEmail','LogNotification','RecordAuditEvent'],
        qry:['GetNotificationLogs','GetAuditLogs'],
        pub:[],
        sub:['UserRegistered','BillGenerated','BillDueReminder','PaymentCompleted','PaymentFailed','FraudDetected','CardExpirySoon','RewardEarned'],
        ctrl:['Notifications','Audit']
      })
    ),
    F('angular-spa/','bs','Angular 19 · standalone components · signals · lazy loading',
      f('src/',
        f('app/',
          f('core/',
            f('interceptors/',fi('auth.interceptor.ts'),fi('error.interceptor.ts')),
            f('guards/',fi('auth.guard.ts'),fi('role.guard.ts'),fi('kyc.guard.ts')),
            f('services/',fi('auth.service.ts'),fi('api.service.ts'),fi('token.service.ts'))
          ),
          f('shared/',
            f('components/',
              f('button/',fi('button.component.ts'),fi('button.component.html')),
              f('card/',fi('card.component.ts'),fi('card.component.html')),
              f('spinner/',fi('spinner.component.ts')),
              f('navbar/',fi('navbar.component.ts'),fi('navbar.component.html'))
            ),
            f('pipes/',fi('currency-inr.pipe.ts'),fi('relative-date.pipe.ts'))
          ),
          F('features/','bs','Lazy-loaded — one folder per route module',
            f('auth/',
              f('login/',fi('login.component.ts'),fi('login.component.html')),
              f('register/',fi('register.component.ts'),fi('register.component.html')),
              f('verify-email/',fi('verify-email.component.ts')),
              f('mfa/',fi('mfa.component.ts'),fi('mfa.component.html')),
              f('reset-password/',fi('reset-password.component.ts'))
            ),
            f('dashboard/',fi('dashboard.component.ts'),fi('dashboard.component.html'),fi('dashboard.service.ts')),
            f('cards/',
              f('card-list/',fi('card-list.component.ts'),fi('card-list.component.html')),
              f('add-card/',fi('add-card.component.ts'),fi('add-card.component.html')),
              f('card-detail/',fi('card-detail.component.ts')),
              fi('cards.service.ts')
            ),
            f('billing/',
              f('bills-list/',fi('bills-list.component.ts'),fi('bills-list.component.html')),
              f('bill-detail/',fi('bill-detail.component.ts')),
              f('rewards/',fi('rewards-summary.component.ts'),fi('rewards-summary.component.html'),'← reward points earned, driven by billing API'),
              fi('billing.service.ts')
            ),
            f('payments/',
              f('pay-bill/',fi('pay-bill.component.ts'),fi('pay-bill.component.html')),
              f('payment-history/',fi('payment-history.component.ts')),
              fi('payments.service.ts')
            ),
            f('profile/',fi('profile.component.ts'),fi('profile.component.html'),fi('profile.service.ts'))
          ),
          fi('app.routes.ts'),fi('app.component.ts')
        ),
        f('environments/',fi('environment.ts'),fi('environment.prod.ts')),
        fi('main.ts'),fi('styles.scss')
      ),
      fi('angular.json'),fi('package.json'),fi('tsconfig.json'),fi('Dockerfile')
    )
  ),
  F('infra/','bi','Static config files — checked into git',
    f('rabbitmq/',fi('definitions.json','Pre-configured exchanges, queues + bindings for 5 services')),
    f('sqlserver/',fi('init.sql','Creates 5 databases: Identity · Card · Billing · Payment · Notification')),
    f('sonarqube/',fi('sonar-project.properties'))
  ),
  fi('docker-compose.yml','Base — 5 services + Ocelot + infra (RabbitMQ, SQL Server, Redis)'),
  fi('docker-compose.override.yml','Local dev — hot reload, debug ports'),
  fi('docker-compose.integration.yml','CI — seeded test data, deterministic ports'),
  fi('docker-compose.infra.yml','Infra only — RabbitMQ, Redis, SQL Server, SonarQube'),
  fi('.env.example','Copy to .env and fill in secrets — never commit .env'),
  fi('.gitignore'),
  fi('credvault.sln','5 services × 4 .csproj + Gateway + Shared.Contracts = 22 projects'),
  fi('README.md')
);

function render(node,depth){
  if(node.t==='i'){
    const e=gext(node.n);
    return `<div class="row" style="padding-left:${6+depth*14}px"><span class="sp"></span><span class="dot d-${e}"></span><span class="fn c-${e}">${node.n}</span>${node.nt?`<span class="nt">← ${node.nt}</span>`:''}</div>`;
  }
  const id=node.id;
  const bl=node.b?BL[node.b]:'';
  const ch=(node.c||[]).map(c=>render(c,depth+1)).join('');
  return `<div id="fd-${id}"><div class="row fr" style="padding-left:${6+depth*14}px" onclick="tog('${id}')"><span class="arr" id="ar-${id}">▶</span><span class="fn fw">${node.n}</span>${bl?`<span class="b ${node.b}">${bl}</span>`:''} ${node.nt?`<span class="nt">${node.nt}</span>`:''}</div><div class="ch cl" id="ch-${id}">${ch}</div></div>`;
}

function tog(id){
  const c=document.getElementById('ch-'+id),a=document.getElementById('ar-'+id);
  const open=c.classList.contains('cl');
  c.classList.toggle('cl',!open);a.classList.toggle('o',open);
}
function xAll(open){
  document.querySelectorAll('.ch').forEach(el=>el.classList.toggle('cl',!open));
  document.querySelectorAll('.arr').forEach(el=>el.classList.toggle('o',open));
}
function openPath(...indices){
  let node=tree;
  const path=[tree];
  for(const i of indices){node=node.c[i];path.push(node);}
  path.forEach(n=>{
    const c=document.getElementById('ch-'+n.id),a=document.getElementById('ar-'+n.id);
    if(c){c.classList.remove('cl');a.classList.add('o');}
  });
}
function xSec(...indices){xAll(0);openPath(...indices);}

document.getElementById('tr').innerHTML=render(tree,0);
openPath();
</script>
